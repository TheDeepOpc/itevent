    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function formatTime(seconds) {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        if (hours > 0) {
            return `${hours}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function renderQuizPage() {
        const q = quizQuestions[currentQuestionIndex];
        const letters = ['A', 'B', 'C', 'D'];
        const progress = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
        
        let optionsHtml = '';
        q.opts.forEach((opt, i) => {
            const isSelected = userAnswers[currentQuestionIndex] === i;
            optionsHtml += `
                <button class="opt ${isSelected ? 'sel' : ''}" onclick="selectAnswer(${i})" ${quizStarted ? '' : 'disabled'}>
                    <span class="opt-l">${letters[i]}</span>
                    <span>${opt}</span>

            `;
        });
        
        return `
            <div class="page active" id="pg-quiz">
                <div class="quiz-wrap">
                    <div class="quiz-top">
                        <div class="quiz-meta">Savol <span>${currentQuestionIndex + 1}</span> / <span>${quizQuestions.length}</span></div>
                        <div class="timer-badge ${timeLeft <= 10 ? 'hot' : ''}">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>

                        </div>
                    </div>
                    <div class="prog-bar-wrap"><div class="prog-bar" style="width:${progress}%"></div></div>

                    <div class="opts" id="q-opts">${optionsHtml}</div>

                        <button class="btn-next" id="btn-next" onclick="nextQuestion()" style="${currentQuestionIndex === quizQuestions.length - 1 ? 'display:block;' : 'display:none;'}">

                        </button>
                    </div>
                </div>
            </div>
        `;
    }
    
    function renderResultPage() {
        const score = userAnswers.filter((ans, idx) => ans === quizQuestions[idx].correct).length;
        const total = quizQuestions.length;
        const minPass = total === 50 ? 30 : Math.ceil(total * 0.6);
        const isPassed = score >= minPass;
        const percentage = (score / total) * 100;
        const circumference = 2 * Math.PI * 70;
        const offset = circumference - (percentage / 100) * circumference;
        
        return `
            <div class="page active" id="pg-result">
                <div class="result-ring">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle class="ring-bg" cx="80" cy="80" r="70" fill="none" stroke-width="8"/>
                        <circle class="ring-fill" cx="80" cy="80" r="70" fill="none" stroke-width="8" stroke-linecap="round" style="stroke:${isPassed ? 'var(--accent)' : 'var(--danger)'}; stroke-dasharray:${circumference}; stroke-dashoffset:${offset}"/>
                    </svg>
                    <div class="ring-inner"><div class="ring-n">${score}</div><div class="ring-d">/ ${total}</div></div>
                </div>
                <div class="result-verdict ${isPassed ? 'pass' : 'fail'}">${isPassed ? '🎉 Tabriklaymiz!' : '❌ Muvaffaqiyatsiz'}</div>
                <p class="result-desc">${currentUser?.firstName}, siz ${score}/${total} ball to'pladingiz. ${isPassed ? '2-bosqichga kirish huquqiga egasiz!' : `2-bosqichga kirish uchun kamida ${minPass} ta to'g'ri javob kerak edi.`}</p>

        `;
    }

    window.startRegistration = function() {
        document.getElementById('app').innerHTML = renderRegistrationPage();
    };
    
    window.showLoginPage = function() {
        document.getElementById('app').innerHTML = renderLoginPage();
    };
    
    window.submitRegistration = async function() {
        const firstName = document.getElementById('reg-fn').value.trim();
        const lastName = document.getElementById('reg-ln').value.trim();
        const grade = document.getElementById('reg-gr').value.trim();
        const age = parseInt(document.getElementById('reg-age').value);
        const phone = document.getElementById('reg-ph').value.trim().replace(/[\s\-()]/g, '');
        const gender = document.getElementById('reg-gn').value;
        const msgDiv = document.getElementById('reg-msg');
        
        if (!firstName || !lastName || !grade || !age || !phone || !gender) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = "Iltimos, barcha maydonlarni to'ldiring!";
            return;
        }
        
        if (age < 5 || age > 99) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = "Yoshni to'g'ri kiriting (5-99)!";
            return;
        }
        
        if (!/^\+?[0-9]{9,13}$/.test(phone)) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = "Telefon raqami noto'g'ri! Masalan: +998901234567";
            return;
        }
        
        // Check if phone exists
        const existing = await db.collection('participants').where('phone', '==', phone).get();
        if (!existing.empty) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = "Bu telefon raqam allaqachon ro'yxatdan o'tgan!";
            return;
        }
        
        currentUser = {
            firstName, lastName, grade, age, phone, gender,
            score: 0, total: 50, status: 'pending', phase1Completed: false
        };
        
        // Save to Firestore
        await db.collection('participants').add(currentUser);
        
        // Start quiz
        startPhase1Quiz();
    };
    
    function startPhase1Quiz() {
        quizQuestions = shuffleArray([...ALL_QUESTIONS]).slice(0, 50);
        userAnswers = new Array(50).fill(null);
        currentQuestionIndex = 0;
        timeLeft = 60;
        quizStarted = true;
        
        renderQuiz();
        startTimer();
    }
    
    function renderQuiz() {
        document.getElementById('app').innerHTML = renderQuizPage();
        if (timerInterval) clearInterval(timerInterval);
        startTimer();
    }
    
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!quizStarted) return;
            timeLeft--;
            const timerSpan = document.getElementById('timer-txt');
            if (timerSpan) timerSpan.textContent = timeLeft;
            
            const badge = document.querySelector('.timer-badge');
            if (badge && timeLeft <= 10) badge.classList.add('hot');
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                autoNextQuestion();
            }
        }, 1000);
    }
    
    window.selectAnswer = function(answerIndex) {
        if (!quizStarted) return;
        if (userAnswers[currentQuestionIndex] !== null) return;
        
        userAnswers[currentQuestionIndex] = answerIndex;
        clearInterval(timerInterval);
        
        // Highlight selected
        const opts = document.querySelectorAll('.opt');
        opts.forEach((opt, idx) => {
            if (idx === answerIndex) opt.classList.add('sel');
        });
        
        // Show next button
        const nextBtn = document.getElementById('btn-next');
        if (nextBtn) nextBtn.style.display = 'block';
    };
    
    function autoNextQuestion() {
        if (userAnswers[currentQuestionIndex] === null) {
            userAnswers[currentQuestionIndex] = -1; // No answer
        }
        
        if (currentQuestionIndex + 1 < quizQuestions.length) {
            currentQuestionIndex++;
            timeLeft = 60;
            renderQuiz();
        } else {
            finishQuiz();
        }
    }
    
    window.nextQuestion = function() {
        if (currentQuestionIndex + 1 < quizQuestions.length) {
            currentQuestionIndex++;
            timeLeft = 60;
            renderQuiz();
        } else {
            finishQuiz();
        }
    };
    
    async function finishQuiz() {
        quizStarted = false;
        if (timerInterval) clearInterval(timerInterval);
        
        const score = userAnswers.filter((ans, idx) => ans === quizQuestions[idx].correct).length;
        const total = quizQuestions.length;
        const minPass = 30;
        const isPassed = score >= minPass;
        
        // Update user data
        currentUser.score = score;
        currentUser.total = total;
        currentUser.status = isPassed ? 'passed' : 'failed';
        currentUser.phase1Completed = true;
        
        // Update Firestore
        const userQuery = await db.collection('participants').where('phone', '==', currentUser.phone).get();
        if (!userQuery.empty) {
            const doc = userQuery.docs[0];
            await doc.ref.update({
                score, total, status: isPassed ? 'passed' : 'failed',
                phase1Completed: true
            });
        }
        
        renderResultPage();
        const saveSpan = document.getElementById('save-st');
        if (saveSpan) {
            saveSpan.textContent = isPassed ? '✓ Natijangiz saqlandi' : '✗ Natijangiz qayd etildi';
            saveSpan.style.color = isPassed ? 'var(--accent)' : 'var(--danger)';
        }
    }
    
    // ============================================================
    // 2-BOSQICH LOGIN VA TEST
    // ============================================================
    window.submitLogin = async function() {
        const phone = document.getElementById('login-ph').value.trim().replace(/[\s\-()]/g, '');
        const msgDiv = document.getElementById('login-msg');
        
        if (!phone) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = "Telefon raqamni kiriting!";
            return;
        }
        
        // Check phase2 status
        const phase2Doc = await db.collection('config').doc('phase2').get();
        const phase2Started = phase2Doc.exists ? phase2Doc.data().started : false;
        
        // Find user
        const userQuery = await db.collection('participants').where('phone', '==', phone).get();
        if (userQuery.empty) {
            msgDiv.style.display = 'block';
            msgDiv.textContent = "Bu telefon raqam ro'yxatda yo'q!";
            return;
        }
        
        const userDoc = userQuery.docs[0];
        const userData = userDoc.data();
        
        if (userData.status !== 'passed') {
            msgDiv.style.display = 'block';
            msgDiv.textContent = `Siz 1-bosqichdan o'tmagansiz! (${userData.score || 0}/50)`;
            return;
        }
        
        currentUser = { ...userData, id: userDoc.id };
        
        if (!phase2Started) {
            document.getElementById('app').innerHTML = renderWaitingPage();
            // Start polling for phase2
            startPollingPhase2();
            return;
        }
        
        // Start phase2 quiz
        startPhase2Quiz();
    };
    
    function startPollingPhase2() {
        const interval = setInterval(async () => {
            const phase2Doc = await db.collection('config').doc('phase2').get();
            if (phase2Doc.exists && phase2Doc.data().started) {
                clearInterval(interval);
                startPhase2Quiz();
            }
        }, 5000);
    }
    
    function startPhase2Quiz() {
        quizQuestions = shuffleArray([...ALL_QUESTIONS]).slice(0, 50);
        userAnswers = new Array(50).fill(null);
        currentQuestionIndex = 0;
        timeLeft = 60;
        quizStarted = true;
        
        // Check if user already has saved progress
        if (currentUser.phase2Answers) {
            userAnswers = currentUser.phase2Answers;
            currentQuestionIndex = userAnswers.findIndex(a => a === null);
            if (currentQuestionIndex === -1) currentQuestionIndex = userAnswers.length;
        }
        
        renderQuiz();
        startTimer();
        startPhase2GlobalTimer();
    }
    
    function startPhase2GlobalTimer() {
        if (phase2Timer) clearInterval(phase2Timer);
        
        // Load remaining time from user or set default
        phase2TimeLeft = currentUser.phase2TimeLeft || 5400;
        
        phase2Timer = setInterval(async () => {
            if (!quizStarted) return;
            phase2TimeLeft--;
            
            // Update timer display if needed
            const timerDisplay = document.querySelector('.quiz-meta');
            if (timerDisplay && phase2TimeLeft <= 300) {
                // Show warning
                timerDisplay.style.color = 'var(--danger)';
            }
            
            if (phase2TimeLeft <= 0) {
                clearInterval(phase2Timer);
                finishPhase2Quiz(true); // Time's up
            }
            
            // Save progress every 10 seconds
            if (phase2TimeLeft % 10 === 0) {
                await savePhase2Progress();
            }
        }, 1000);
    }
    
    async function savePhase2Progress() {
        if (!currentUser || !quizStarted) return;
        
        const score = userAnswers.filter((ans, idx) => ans === quizQuestions[idx]?.correct).length;
        const total = userAnswers.filter(a => a !== null).length;
        
        await db.collection('participants').doc(currentUser.id).update({
            phase2Answers: userAnswers,
            phase2CurrentIndex: currentQuestionIndex,
            phase2TimeLeft: phase2TimeLeft,
            phase2Score: score,
            phase2TotalAnswered: total,
            phase2LastUpdate: new Date()
        });
    }
    
    async function finishPhase2Quiz(isTimeOut = false) {
        quizStarted = false;
        if (timerInterval) clearInterval(timerInterval);
        if (phase2Timer) clearInterval(phase2Timer);
        
        const score = userAnswers.filter((ans, idx) => ans === quizQuestions[idx]?.correct).length;
        const total = quizQuestions.length;
        const minPass = 30;
        const isPassed = score >= minPass;
        
        await db.collection('participants').doc(currentUser.id).update({
            phase2Completed: true,
            phase2Score: score,
            phase2Passed: isPassed,
            phase2CompletedAt: new Date(),
            phase2TimeOut: isTimeOut
        });
        
        currentUser.phase2Completed = true;
        currentUser.phase2Score = score;
        
        renderPhase2ResultPage(score, total, isPassed, isTimeOut);
    }
    
    function renderPhase2ResultPage(score, total, isPassed, isTimeOut) {
        const percentage = (score / total) * 100;
        const circumference = 2 * Math.PI * 70;
        const offset = circumference - (percentage / 100) * circumference;
        
        document.getElementById('app').innerHTML = `
            <div class="page active" id="pg-result">
                <div class="result-ring">
                    <svg width="160" height="160" viewBox="0 0 160 160">
                        <circle class="ring-bg" cx="80" cy="80" r="70" fill="none" stroke-width="8"/>
                        <circle class="ring-fill" cx="80" cy="80" r="70" fill="none" stroke-width="8" stroke-linecap="round" style="stroke:${isPassed ? 'var(--accent)' : 'var(--danger)'}; stroke-dasharray:${circumference}; stroke-dashoffset:${offset}"/>
                    </svg>
                    <div class="ring-inner"><div class="ring-n">${score}</div><div class="ring-d">/ ${total}</div></div>
                </div>
                <div class="result-verdict ${isPassed ? 'pass' : 'fail'}">${isPassed ? '🎉 Tabriklaymiz!' : '❌ Muvaffaqiyatsiz'}</div>
                <p class="result-desc">${isTimeOut ? 'Vaqt tugadi! ' : ''}Siz ${score}/${total} ball to'pladingiz. ${isPassed ? 'Tanlovda qatnashish huquqini qo\'lga kiritdingiz!' : 'Afsuski, bu safar yetarli ball to\'play olmadingiz.'}</p>
                <div class="rbadges">
                    <div class="rb ${isPassed ? 'pass' : 'fail'}">${score}/${total} ball</div>
                    <div class="rb neu">${isPassed ? '✓ 2-bosqich o\'tdi' : '✗ Yetarli emas'}</div>
                </div>
                <button class="btn btn-outline" onclick="renderApp()">↩ Bosh sahifa</button>
            </div>
        `;
    }
    
    // ============================================================
    // ASOSIY RENDER FUNKSIYASI
    // ============================================================
    function renderApp() {
        currentUser = null;
        quizStarted = false;
        if (timerInterval) clearInterval(timerInterval);
        if (phase2Timer) clearInterval(phase2Timer);
        document.getElementById('app').innerHTML = renderWelcomePage();
    }
    
    // Initialize app
    renderApp();
</script>
</body>
</html>
